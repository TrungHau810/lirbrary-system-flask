{% extends 'base.html' %}
{% block title %}{{ legend }}{% endblock %}

{% block content %}
<div class="card shadow-sm col-lg-8 mx-auto">
    <div class="card-header">
        <h4 class="card-title mb-0">{{ legend }}</h4>
    </div>
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label for="name" class="form-label">Tên sách</label>
                <input type="text" id="name" name="name" value="{{ book.name if book else '' }}" required
                       class="form-control">
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="price" class="form-label">Giá</label>
                    <input type="number" step="1000" id="price" name="price" value="{{ book.price if book else '' }}"
                           required class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="quantity" class="form-label">Số lượng</label>
                    <input type="number" id="quantity" name="quantity" value="{{ book.quantity if book else '' }}"
                           required class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label for="author_id" class="form-label">Tác giả</label>
                <select name="author_id" id="author_id" required class="form-select">
                    <option value="">-- Chọn tác giả --</option>
                    {% for a in authors %}
                    <option value="{{ a.id }}"
                            {% if book and book.author_id== a.id %}selected{% endif %}>
                        {{ a.name }}
                    </option>

                    {% endfor %}
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="category_id" class="form-label">Danh mục</label>
                    <select name="category_id" id="category_id" required class="form-select">
                        <option value="">-- Chọn danh mục --</option>
                        {% for c in categories %}
                        <option value="{{ c.id }}"
                                {% if book and book.category_id== c.id %}selected{% endif %}>
                            {{ c.name }}
                        </option>

                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="publisher_id" class="form-label">Nhà xuất bản</label>
                    <select name="publisher_id" id="publisher_id" required class="form-select">
                        <option value="">-- Chọn NXB --</option>
                        {% for p in publishers %}
                        <option value="{{ p.id }}"
                                {% if book and book.publisher_id== p.id %}selected{% endif %}>
                            {{ p.name }}
                        </option>

                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="image" class="form-label">Link ảnh bìa</label>
                <input type="text" id="image" name="image" value="{{ book.image if book else '' }}"
                       class="form-control">
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Mô tả</label>
                <textarea id="description" name="description" rows="5" class="form-control">{{ book.description if book else '' }}</textarea>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle me-1"></i>{{ 'Cập nhật' if book else 'Thêm mới' }}
                </button>
                <a href="{{ url_for('manage_books') }}" class="btn btn-secondary">
                    <i class="bi bi-x-circle me-1"></i>Hủy
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
