{% extends 'base.html' %}
{% block title %}Thêm người dùng{% endblock %}

{% block content %}

    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4 class="card-title mb-0">
                        {% if user %}Chỉnh sửa người dùng{% else %}Thêm người dùng mới{% endif %}
                    </h4>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="username" class="form-label">Tên đăng nhập</label>
                            <input type="text" id="username" name="username" value="{{ user.username if user else '' }}"
                                   required
                                   class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="full_name" class="form-label">Họ và tên</label>
                            <input type="text" id="full_name" name="full_name" value="{{ user.full_name if user else '' }}" required
                                   class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" value="{{ user.email if user else '' }}" required
                                   class="form-control">
                        </div>
                        {% if not user %}
                        <div class="mb-3">
                            <label for="password" class="form-label">Mật khẩu</label>
                            <input type="password" id="password" name="password"
                                   class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Xác nhận mật khẩu</label>
                            <input type="password" id="confirm_password" name="confirm_password"
                                   class="form-control">
                        </div>
                        {% endif %}
                        <div class="mb-3">
                            <label for="avatar" class="form-label">Ảnh đại diện</label>
                            <input type="file" id="avatar" name="avatar" class="form-control">
                        </div>
                        {% if user and user.avatar %}
                        <div class="mb-3">
                            <label class="form-label">Ảnh đại diện hiện tại</label><br>
                            <img src="{{ user.avatar }}" alt="Avatar" class="img-thumbnail" style="max-width: 150px;">
                        </div>
                        {% endif %}
                        <div class="mb-3">
                            <label for="user_role" class="form-label">Vai trò</label>
                            <select name="user_role" id="user_role" required class="form-select">
                                <option value="">-- Chọn vai trò --</option>
                                <option value="ADMIN" {% if user and user.user_role and user.user_role.value == 1 %}selected{% endif %}>
                                    Admin
                                </option>
                                <option value="STAFF" {% if user and user.user_role and user.user_role.value == 2 %}selected{% endif %}>
                                    Thủ thư
                                </option>
                                <option value="STUDENT" {% if user and user.user_role and user.user_role.value == 3 %}selected{% endif %}>
                                    Sinh viên
                                </option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Lưu</button>
                        <a href="/admin/users" class="btn btn-secondary ms-2">Hủy</a>
                    </form>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
