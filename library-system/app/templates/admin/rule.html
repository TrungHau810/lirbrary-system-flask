{% extends 'base.html' %}
{% block title %}Quản lý kho sách{% endblock %}

{% block content %}
<h3 class="mb-4">Quản lý quy định</h3>
<a href="{{ url_for('admin_add_rule') }}" class="btn btn-success mb-3">
    <i class="bi bi-plus-circle me-1"></i>Thêm quy định mới
</a>
<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
            <th scope="col">#</th>
            <th scope="col">Nội dung</th>
            <th scope="col">Giá trị</th>
            <th scope="col">Hành động</th>
        </tr>
        </thead>
        <tbody>
        {% for rule in rules %}
        <tr>
            <td>{{ rule.id }}</td>
            <td>{{ rule.name }}</td>
            <td>{{ rule.value }}</td>
            <td>
                <a href="{{ url_for('admin_edit_rule', rule_id=rule.id) }}" class="btn btn-sm btn-primary me-2">
                    <i class="bi bi-pencil-fill"></i> Sửa
                </a>

                <a href="{{ url_for('admin_delete_rule', rule_id=rule.id) }}" class="btn btn-sm btn-danger">
                    <i class="bi bi-trash-fill"></i> Xóa
                </a>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
