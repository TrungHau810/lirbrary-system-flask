{% extends "base.html" %}
{% block title %}Đăng ký{% endblock %}
{% block content %}
<div class="container-fluid bg-light d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-md-8 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h3 class="mt-2 fw-bold">Đăng ký tài khoản</h3>
                    <p class="text-muted">Hệ thống thư viện số</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">

                    <div class="mb-3">
                        <label for="fullname" class="form-label">Họ và tên</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="fullname" name="fullname" placeholder="Nguyễn Văn A" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label">Tên đăng nhập</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Tên đăng nhập" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="******" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Xác nhận mật khẩu</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="******" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="student_id" class="form-label">MSSV</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                            <input type="text" class="form-control" id="student_id" name="student_id" placeholder="12345678" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="email" class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="example@gmail.com" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                        <i class="bi bi-check-circle"></i> Đăng ký
                    </button>
                </form>

                <p class="text-center mt-4 mb-0">
                    Đã có tài khoản? <a href="{{ url_for('login') }}" class="text-decoration-none">Đăng nhập ngay</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
